{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Registrar movimiento</h1><p>Revisa los datos antes de confirmar. Los movimientos guardados se conservan en el historial.</p><form method="post"><label>Producto<select name="producto_id" required>{% for p in productos %}<option value="{{ p.id }}">{{ p.codigo }} · {{ p.nombre }} ({{ p.existencias }} disponibles)</option>{% endfor %}</select></label><label>Tipo<select name="tipo" id="tipo" onchange="document.getElementById('motivo').hidden=this.value!=='salida';document.getElementById('motivoSelect').required=this.value==='salida'"><option value="entrada">Entrada</option><option value="salida">Salida</option></select></label><label>Cantidad en piezas<input name="cantidad" type="number" min="1" step="1" required></label><label id="motivo" hidden>Motivo de salida<select id="motivoSelect" name="motivo"><option value="">Seleccionar</option>{% for m in motivos %}<option value="{{ m }}">{{ m|capitalize }}</option>{% endfor %}</select></label><button {% if not productos %}disabled{% endif %}>Confirmar movimiento</button></form></section>{% endblock %}
